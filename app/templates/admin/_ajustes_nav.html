{% if not g.ajustes_embebidos %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
<h1 class="h3 mb-0">{{ _('Ajustes') }}</h1>
<a href="{{ url_for('admin.auditoria', tipo='Ajuste') }}">{{ _('Ver cambios') }}</a></div>
{% set tema_actual = tema if tema is defined else destinos_ajustes.get(request.endpoint, ('comunicaciones', ''))[0] %}
<nav class="nav nav-pills ajustes-nav mb-3" aria-label="{{ _('Ajustes') }}">
{% for clave, nombre in temas_ajustes.items() %}<a class="nav-link {{ 'active' if clave == tema_actual }}" {{ 'aria-current=page' if clave == tema_actual }} href="{{ url_for('admin.ajustes_panel', tema=clave) }}">{{ nombre }}</a>{% endfor %}
</nav>{% endif %}
