# nginx: recibe las visitas de internet, pone el HTTPS y se las pasa a la plataforma (gunicorn).
# Instalar:  sudo cp deploy/nginx.conf /etc/nginx/sites-available/yikonpo
#            sudo ln -s /etc/nginx/sites-available/yikonpo /etc/nginx/sites-enabled/
#            sudo nginx -t && sudo systemctl reload nginx
# El HTTPS lo añade después certbot (paso 7 de DESPLIEGUE.md): él mismo edita este archivo.
# Si cambia el dominio, cámbialo aquí en server_name.

server {
    listen 80;
    listen [::]:80;
    server_name yikonsupport.com www.yikonsupport.com;

    # Tamaño máximo de una subida: igual que MAX_CONTENT_LENGTH de config.py (80 MB)
    client_max_body_size 80m;

    # Lo que no cambia (CSS, JS, imágenes) lo sirve nginx directamente: más rápido
    location /static/ {
        alias /srv/yikonpo/app/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        # Lo que la plataforma necesita saber de la visita real (ver app/produccion.py).
        # X-Forwarded-For se SOBRESCRIBE (no se añade): así nadie puede falsear su IP.
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

